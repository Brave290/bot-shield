name: Smoke Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run smoke tests
        env:
          BASE_URL: https://bo-tshield.vercel.app
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          SMOKE_SECRET_KEY: ${{ secrets.SMOKE_SECRET_KEY }}
        run: node scripts/smoke-test.mjs
