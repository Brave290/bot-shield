name: Smoke Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run smoke tests
        env:
          BASE_URL: https://bo-tshield.vercel.app
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          SMOKE_SECRET_KEY: ${{ secrets.SMOKE_SECRET_KEY }}
          SMOKE_ALLOW_RATE_LIMITED: "true"
        run: node scripts/smoke-test.mjs
      - name: Run security scenarios when staging credentials are configured
        env:
          BASE_URL: https://bo-tshield.vercel.app
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          SMOKE_SECRET_KEY: ${{ secrets.SMOKE_SECRET_KEY }}
          SMOKE_ALLOWED_ORIGIN: https://bo-tshield.vercel.app
          RUN_RATE_LIMIT: "false"
        run: node scripts/live-security-test.mjs
